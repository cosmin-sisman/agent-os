# Reference stacks by complexity level (1 simple .. 5 complex), in two families:
# typescript (one language end to end) and polyglot (each language where it fits).
# /kickoff proposes one of these; `agent-os stack new --from <id>` turns it into a stack.yaml.
# A row has either `tech` (an id from technologies.yaml) or a free `detail` with language and provider ids.

- id: brochure-site
  level: 1
  family: typescript
  name:
    en: "Brochure site"
    ro: "Site de prezentare"
  description:
    en: "Presentation site with a menu and a contact form"
    ro: "Site de prezentare cu meniu si formular de contact"
  takeaway:
    en: "No backend and no database. Built in one or two days, costs almost nothing per month."
    ro: "Fara backend si fara baza de date. Se face in 1-2 zile, cost aproape zero pe luna."
  layers:
    - layer: public-frontend
      tech: astro
      detail: "Astro + Tailwind; Astro Actions for the form"
    - layer: email-notifications
      tech: resend
      detail: "Sends the contact form email"
    - layer: storage
      detail: "Images in the repository, served by the CDN"
      language: none
      provider: vercel
    - layer: ci-cd
      tech: vercel-auto-deploy
      detail: "Deploy on every push"

- id: booking-app
  level: 2
  family: typescript
  name:
    en: "Booking app"
    ro: "Aplicatie de programari"
  description:
    en: "Public site, online booking and an admin panel"
    ro: "Site public, programari online si panou de administrare"
  takeaway:
    en: "No backend of your own: the BaaS takes its place. Fast and cheap, with limited control."
    ro: "Nu ai backend propriu, Supabase ii tine locul. Rapid si ieftin, dar control limitat."
  layers:
    - layer: public-frontend
      tech: astro
    - layer: internal-frontend
      tech: vite-react-tanstack-router
      detail: "Vite + React + shadcn admin"
    - layer: internal-api
      tech: supabase-direct-supabase-js-rls
    - layer: backend-services
      tech: supabase-edge-functions
      detail: "Booking confirmations"
    - layer: background-workers
      tech: pg-cron
      detail: "Reminder one day before"
    - layer: data-layer
      detail: "Supabase Postgres"
      language: sql
      provider: supabase
      runtime: "Managed"
    - layer: storage
      tech: supabase-storage
    - layer: auth
      tech: supabase-auth
    - layer: ci-cd
      tech: github-actions
      detail: "GitHub + Supabase CLI for migrations"

