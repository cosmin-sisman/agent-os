# The skill evals (#59): deterministic scenarios on fixture repositories generated on the fly (scripts/evals/). They
# also run on every pull request and push, inside npm test. This workflow runs them on their own, with the per-scenario
# output. It is manual only: this repository keeps no scheduled workflow active, so a schedule is the owner's to add.
# Model-driven scenarios never run here.
name: evals

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: node scripts/evals/run.mjs
