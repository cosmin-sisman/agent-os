# Publishes the package to npm with provenance when a release tag (v*) is pushed: exactly the tagged commit, only
# when the tag matches package.json's version and the commit is on main. The NPM_TOKEN secret is the owner's to add;
# without it the job fails with a clear message and publishes nothing.
name: publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: npm publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Check the tag, the version and the branch
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release/check-publish.mjs "$TAG"
      - name: Check the token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::The NPM_TOKEN secret is not set: the repository owner adds it (Settings → Secrets and variables → Actions). Nothing was published."
            exit 1
          fi
      - run: npm test
      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
