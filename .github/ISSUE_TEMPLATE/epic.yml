name: Epic
description: A large piece of work split into sub-issues.
labels: ["type:epic"]
body:
  - type: textarea
    id: goal
    attributes: { label: Goal }
    validations: { required: true }
  - type: textarea
    id: why
    attributes: { label: Why now }
  - type: textarea
    id: done
    attributes: { label: Done when, value: "- [ ] every sub-issue is closed\n- [ ] " }
  - type: textarea
    id: refs
    attributes: { label: References }
