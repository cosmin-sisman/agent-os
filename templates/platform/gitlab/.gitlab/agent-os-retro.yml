# The retro schedule (agent-os): run it from a weekly pipeline schedule (CI/CD → Schedules). When the lessons inbox is
# not empty it opens or updates one "Retro" issue, and closes it when the inbox is empty. Include it from
# .gitlab-ci.yml:
#   include:
#     - local: .gitlab/agent-os-retro.yml
# It needs a project access token with the api scope in the GITLAB_TOKEN variable (masked).
agent-os/retro:
  stage: test
  image: "{{{runner.gitlabImage}}}"
{{#if runner.tags}}
  tags: {{{runner.tags}}}
{{/if}}
  timeout: 10m
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - {{{runner.npx}}} retro issue
