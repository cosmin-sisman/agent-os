{{! area: issues }}
name: Bug
description: Something works wrong.
labels: [{{labels.type.bug}}]
body:
  - type: textarea
    id: what
    attributes: { label: What happens, description: "Exact output or error, in a code block." }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What should happen }
    validations: { required: true }
  - type: textarea
    id: repro
    attributes: { label: How to reproduce, value: "1. " }
    validations: { required: true }
  - type: textarea
    id: scenarios
    attributes: { label: Test scenarios, description: "The regression test that will prove the fix." }
