# The retro schedule (agent-os): once a week, when the lessons inbox is not empty, open or update one "Retro" issue
# listing each lesson with a proposed decision; close it when the inbox is empty. Triage itself is /retro.
# Managed by agent-os.
name: agent-os retro

on:
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  retro:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 200
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npx -y @cosmin-sisman/agent-os{{#if version}}@{{{version}}}{{/if}} retro issue
        env:
          GH_TOKEN: {{{expr.open}}} secrets.GITHUB_TOKEN {{{expr.close}}}
