<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="agent-os logo">
  <title>agent-os</title>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  </defs>
  <!-- the loop: capture → triage → apply → verify, around the stack -->
  <path d="M60 8 A52 52 0 1 1 13.6 37" fill="none" stroke="#64748b" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
  <path d="M13.6 37 l-1.8 -12.6 l11.4 6.2 z" fill="#64748b" fill-opacity=".55"/>
  <!-- three layers of a stack -->
  <path d="M60 74 L92 58 L60 42 L28 58 Z" fill="url(#c)" transform="translate(0 16)"/>
  <path d="M60 74 L92 58 L60 42 L28 58 Z" fill="url(#b)" transform="translate(0 2)"/>
  <path d="M60 74 L92 58 L60 42 L28 58 Z" fill="url(#a)" transform="translate(0 -12)"/>
  <!-- the agent: a spark on the top layer -->
  <circle cx="60" cy="46" r="4.5" fill="#fff"/>
</svg>
