<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" role="img" aria-label="agent-os: the operating agreement for people, coding agents, GitHub and GitLab">
  <title>agent-os</title>
  <style>
    .word{font:700 64px "Space Grotesk","Segoe UI",system-ui,sans-serif;fill:#0f172a;letter-spacing:-1.5px}
    .tag{font:500 20px "Inter","Segoe UI",system-ui,sans-serif;fill:#475569}
    .chip{font:500 13px "JetBrains Mono",ui-monospace,Consolas,monospace;fill:#334155}
    .chipbg{fill:#f1f5f9;stroke:#cbd5e1}
    @media (prefers-color-scheme: dark){ .word{fill:#f8fafc} .tag{fill:#cbd5e1} .chip{fill:#e2e8f0} .chipbg{fill:#1e293b;stroke:#334155} }
  </style>
  <defs>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fb923c"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient>
  </defs>
  <g transform="translate(30 30) scale(1.18)">
    <path d="M60 8 A52 52 0 1 1 13.6 37" fill="none" stroke="#64748b" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
    <path d="M13.6 37 l-1.8 -12.6 l11.4 6.2 z" fill="#64748b" fill-opacity=".55"/>
    <path d="M60 74 L92 58 L60 42 L28 58 Z" fill="url(#c)" transform="translate(0 16)"/>
    <path d="M60 74 L92 58 L60 42 L28 58 Z" fill="url(#b)" transform="translate(0 2)"/>
    <path d="M60 74 L92 58 L60 42 L28 58 Z" fill="url(#a)" transform="translate(0 -12)"/>
    <circle cx="60" cy="46" r="4.5" fill="#fff"/>
  </g>
  <text x="210" y="98" class="word">agent-os</text>
  <text x="212" y="134" class="tag">The operating agreement for people, coding agents, GitHub and GitLab.</text>
  <g transform="translate(212 154)">
    <rect class="chipbg" x="0" y="0" width="92" height="26" rx="13"/><text class="chip" x="16" y="18">skills</text>
    <rect class="chipbg" x="102" y="0" width="92" height="26" rx="13"/><text class="chip" x="120" y="18">rules</text>
    <rect class="chipbg" x="204" y="0" width="122" height="26" rx="13"/><text class="chip" x="220" y="18">stack map</text>
    <rect class="chipbg" x="336" y="0" width="150" height="26" rx="13"/><text class="chip" x="352" y="18">learning loop</text>
    <rect class="chipbg" x="496" y="0" width="160" height="26" rx="13"/><text class="chip" x="512" y="18">GitHub · GitLab</text>
  </g>
</svg>
